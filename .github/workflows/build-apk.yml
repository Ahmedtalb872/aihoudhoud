name: Build Android APK + App Bundle

on:
  push:
    branches:
      - claude/project-details-o5qgzr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Give this build a unique version code
        # pubspec.yaml's build number (the part after "+") was hardcoded at
        # 1 forever, so every APK this workflow ever produced had the exact
        # same Android versionCode. Android's installer treats "same
        # versionCode" as "not a new version" and can silently refuse to
        # overwrite the already-installed copy - a captain testing a fix
        # would download the new APK, install it, and keep running the old
        # code with no error shown. github.run_number strictly increases
        # on every run of this workflow, so it's a safe, always-fresh
        # versionCode.
        run: |
          sed -i -E "s/^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+/version: 1.0.0+${{ github.run_number }}/" pubspec.yaml

      - name: Write Supabase config
        run: |
          cat > env.json <<'EOF'
          {
            "SUPABASE_URL": "https://hdjxtnzwxqkrihhvssej.supabase.co",
            "SUPABASE_ANON_KEY": "sb_publishable_K63bm3UI9aVz6U7z03agDQ_j8_LkL8v"
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Build release App Bundle (for Play Store upload)
        run: flutter build appbundle --release --dart-define-from-file=env.json

      - name: Publish APK + App Bundle to the "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: أحدث نسخة
          body: |
            يتم تحديث هذا الإصدار تلقائيًا مع كل تعديل على فرع claude/project-details-o5qgzr.

            - app-release.apk: للتثبيت المباشر على هاتف أندرويد (نزّله وثبّته مباشرة).
            - app-release.aab: App Bundle لرفعه على Google Play Console - لا يُثبَّت مباشرة على هاتف.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
