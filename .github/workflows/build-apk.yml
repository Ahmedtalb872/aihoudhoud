name: Build Android APK + App Bundle

on:
  push:
    branches:
      - claude/project-details-o5qgzr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Write Supabase config
        run: |
          cat > env.json <<'EOF'
          {
            "SUPABASE_URL": "https://hdjxtnzwxqkrihhvssej.supabase.co",
            "SUPABASE_ANON_KEY": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhkanh0bnp3eHFrcmloaHZzc2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MzkyOTAsImV4cCI6MjA5OTQxNTI5MH0.1bDOUcN5g6I4VWTA4HE8wXhSz30CsAXyCOAkSRvgnhs"
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Build release App Bundle (for Play Store upload)
        run: flutter build appbundle --release --dart-define-from-file=env.json

      - name: Publish APK + App Bundle to the "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: أحدث نسخة
          body: |
            يتم تحديث هذا الإصدار تلقائيًا مع كل تعديل على فرع claude/project-details-o5qgzr.

            - app-release.apk: للتثبيت المباشر على هاتف أندرويد (نزّله وثبّته مباشرة).
            - app-release.aab: App Bundle لرفعه على Google Play Console - لا يُثبَّت مباشرة على هاتف.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
